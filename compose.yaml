name: roundmate

services:
  postgres:
    image: "postgres:18"
    environment:
      POSTGRES_DB: roundmate
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - "roundmate-postgres-data:/var/lib/postgresql"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U roundmate -d roundmate" ]
      interval: 5s
      timeout: 3s
      retries: 5

  roundmate:
    build:
      context: .
      dockerfile: Dockerfile
    image: roundmate:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/roundmate
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  roundmate-postgres-data:
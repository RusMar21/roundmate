name: roundmate

services:
  postgres:
    image: "postgres:18"
    environment:
      POSTGRES_DB: roundmate
      POSTGRES_USER: roundmate
      POSTGRES_PASSWORD: roundmate
    ports:
      - "5432:5432"
    volumes:
      - "roundmate-postgres-data:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roundmate -d roundmate"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  roundmate-postgres-data: